; Cardputer ADV (M5Stack) — 摸鱼时钟固件
; 主控: ESP32-S3FN8 (Stamp-S3A), 8MB Flash, 无 PSRAM
; 屏幕: 1.14" ST7789 240x135
; 板子通过原生 USB-C 连接，所以要打开 USB CDC 才能用串口

[env:cardputer-adv]
; ⚠️ 平台、Arduino core 和下面所有库都钉死在实测过的版本上，原因和升级步骤见
; docs/dependency-pins.md。不钉的话，新机器/服务器上全新构建会解析到别的版本，
; 同一份代码编出来的固件就不一样了（实测 Flash 多 380KB、RAM 多 6KB）。
platform = espressif32@8.0.0
; PlatformIO 8.0.0 fournit Arduino-ESP32 3.3.12 / ESP-IDF 5.5.5.
; Ne pas réimposer ici l'ancien framework Arduino 2.0.17.
board = esp32-s3-devkitc-1
framework = arduino

; --- 板子物理参数 ---
board_build.flash_size = 8MB
board_build.partitions = partitions_8MB.csv
board_upload.flash_size = 8MB

; --- 串口 ---
monitor_speed = 115200

; --- 原生 USB-C 串口 (Cardputer 没有独立 USB 转串口芯片) ---
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
; Activer les annonces BLE 5 étendues et le scan Coded PHY sur ESP32-S3.
	-DCONFIG_BT_NIMBLE_EXT_ADV=1
	-Wno-cpp                       ; 静音 RadioLib 里那条无害的 "USB CDC debug" #warning

; --- 只对 src/ 开警告 ---
; 用 build_src_flags 而不是 build_flags：后者会连第三方库一起编，M5GFX/RadioLib 那边
; 的警告会把输出淹掉，自己代码的问题反而看不见。
; 这套开起来当场抓到过真问题：LoRa 抓包日志那行的缓冲区只有 40 字节，而 Meshtastic
; 帧头那行最长 39 字符——再多一位 RSSI 就被截掉了。
build_src_flags =
	-Wall
	-Wextra
	-Wno-unused-parameter          ; 回调签名固定，用不到的形参很正常
	-Wno-missing-field-initializers ; 结构体只初始化前几个字段是这个项目的常用写法

; --- 根证书 bundle ---
; 121 张 Mozilla 根证书，编进 flash（约 56KB）。有了它就能对任意公网 HTTPS 做**真校验**，
; 不用给每个域名手贴一份根证书、也不用退回 setInsecure()。
; ⚠️ RAM 开销很小：只有索引常驻，证书本体留在 flash 里按需读。
; 重新生成（换新根证书 / 想换证书来源时）：见 tools/README.md 的 "根证书 bundle" 一节。
board_build.embed_files = data/cert/x509_crt_bundle.bin

; --- 依赖库：全部精确版本（为什么、怎么升级见 docs/dependency-pins.md）---
lib_deps =
	; M5Unified/M5GFX sont mis à niveau ensemble en 0.3.0 ; mesurer écran et micro sur la carte.
	m5stack/M5Unified@0.3.0
	; Épingler M5GFX indépendamment évite une résolution transitive imprévisible.
	m5stack/M5GFX@0.3.0
	h2zero/NimBLE-Arduino@2.5.2
	mikalhart/TinyGPSPlus@1.1.0
	bblanchon/ArduinoJson@7.4.3
	jgromes/RadioLib@7.7.1
	; FastLED reste épinglé pour isoler le portage IDF 5 ; mesurer Flash, RAM et RMT/SK6812 avant évolution.
	fastled/FastLED@3.10.3
	; Décodeur MP3 de la radio réseau ; la dépendance Git reste épinglée pendant la migration IDF 5.5.5.
	https://github.com/earlephilhower/ESP8266Audio.git#1.9.9
	ewpa/LibSSH-ESP32@5.9.0

