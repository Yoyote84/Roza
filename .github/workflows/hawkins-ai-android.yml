name: Hawkins AI Android

on:
  push:
    paths:
      - "android/hawkins-ai-bridge/**"
      - "android/llama.cpp"
      - ".gitmodules"
      - ".github/workflows/hawkins-ai-android.yml"
  pull_request:
    paths:
      - "android/hawkins-ai-bridge/**"
      - "android/llama.cpp"
      - ".gitmodules"
      - ".github/workflows/hawkins-ai-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository and pinned llama.cpp submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        working-directory: android/hawkins-ai-bridge
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Run Kotlin unit tests
        working-directory: android/hawkins-ai-bridge
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hawkins-ai-bridge-debug
          path: android/hawkins-ai-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
