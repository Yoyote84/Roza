name: Hawkins AI Android

on:
  push:
    paths:
      - "android/hawkins-ai-bridge/**"
      - "android/llama.cpp"
      - ".gitmodules"
      - ".github/workflows/hawkins-ai-android.yml"
      - "firmware/src/hawkins_ai_protocol.*"
      - "firmware/src/hawkins_app.*"
      - "firmware/src/serial_cmd.cpp"
      - "firmware/src/main.cpp"
  pull_request:
    paths:
      - "android/hawkins-ai-bridge/**"
      - "android/llama.cpp"
      - ".gitmodules"
      - ".github/workflows/hawkins-ai-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository and pinned llama.cpp submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add precise native GGUF load diagnostics to pinned llama.cpp
        run: python3 android/hawkins-ai-bridge/patch_llama_android.py

      - name: Verify llama.cpp generation token limit
        run: |
          grep -F "stop_generation_position = current_position + n_predict;" \
            android/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          if grep -F "stop_generation_position = current_position + user_prompt_size + n_predict;" \
            android/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp; then
            echo "Generation limit still counts the prompt twice."
            exit 1
          fi

name: Hawkins AI Android

on:
  push:
    paths:
      - "android/hawkins-ai-bridge/**"
      - "android/llama.cpp"
      - ".gitmodules"
      - ".github/workflows/hawkins-ai-android.yml"
      - "firmware/src/hawkins_ai_protocol.*"
      - "firmware/src/hawkins_app.*"
      - "firmware/src/serial_cmd.cpp"
      - "firmware/src/main.cpp"
  pull_request:
    paths:
      - "android/hawkins-ai-bridge/**"
      - "android/llama.cpp"
      - ".gitmodules"
      - ".github/workflows/hawkins-ai-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository and pinned llama.cpp submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add precise native GGUF load diagnostics to pinned llama.cpp
        run: python3 android/hawkins-ai-bridge/patch_llama_android.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        working-directory: android/hawkins-ai-bridge
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Android CPU backend is extractable from APK
        working-directory: android/hawkins-ai-bridge
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          assert apk.is_file(), f"APK not found: {apk}"
          with zipfile.ZipFile(apk) as archive:
              entries = set(archive.namelist())
              baseline = "lib/arm64-v8a/libggml-cpu-android_armv8.0_1.so"
              assert baseline in entries, f"Missing baseline CPU backend: {baseline}"
              info = archive.getinfo(baseline)
              assert info.compress_type != zipfile.ZIP_STORED, (
                  "CPU backend must be compressed/extracted at install time; "
                  "JNI legacy packaging is not active."
              )
              plugins = sorted(
                  name for name in entries
                  if name.startswith("lib/arm64-v8a/libggml-cpu-") and name.endswith(".so")
              )
              assert plugins, "No arm64 CPU backend plugins found in APK"
              print(f"Verified {len(plugins)} ARM64 CPU backend plugins; baseline is extractable.")
          PY

      - name: Run Kotlin unit tests
        working-directory: android/hawkins-ai-bridge
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Prepare offline APK package
        working-directory: android/hawkins-ai-bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Hawkins-AI-Companion.apk
          cat > dist/INSTALLATION.txt <<'EOF'
          HAWKINS AI — COMPAGNON ANDROID HORS LIGNE

          1. Installez Hawkins-AI-Companion.apk sur un appareil Android 13 ou plus recent.
          2. Importez un modele GGUF compatible llama.cpp depuis le stockage local.
          3. Appuyez sur Charger le modele et attendez le statut "Inference locale prete".
          4. Reliez le Cardputer ADV en USB-C OTG et autorisez l'acces USB.
          5. Dans le jeu Hawkins, ouvrez le narrateur avec A puis choisissez 1, 2 ou 3.

          Le modele GGUF n'est pas inclus dans l'APK. Il doit etre telecharge ou transfere
          une seule fois, puis importe dans l'application. L'inference fonctionne ensuite
          sans Wi-Fi, donnees mobiles, serveur ou service cloud.

          Le modele est copie dans le stockage prive de l'application. Prevoyez au moins
          3,3 Go d'espace supplementaire pour le fichier Q4_K_M d'environ 3 Go.
          EOF
          (cd dist && sha256sum Hawkins-AI-Companion.apk > SHA256SUMS.txt)

      - name: Publish offline APK package
        uses: actions/upload-artifact@v4
        with:
          name: hawkins-ai-android-offline
          path: android/hawkins-ai-bridge/dist/*
          if-no-files-found: error
          retention-days: 90
