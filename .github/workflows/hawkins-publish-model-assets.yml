name: Publish Hawkins French model assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hawkins-publish-model-assets.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hawkins-model-assets-publish
  cancel-in-progress: false

jobs:
  publish-model-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the latest ROZA main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download the already successful stage-3 model export
        uses: actions/download-artifact@v4
        with:
          name: hawkins-lecarnet3m-step3-3766f8effa93491d00fa7a7c2fa674ba3995b403
          path: ${{ runner.temp }}/hawkins-stage3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 44958543933

      - name: Check and publish the exact model files
        env:
          STAGE3_DIR: ${{ runner.temp }}/hawkins-stage3
        run: |
          set -euo pipefail
          MODEL="$(find "$STAGE3_DIR" -type f -name model_lecarnet_q4.bin -print -quit)"
          TOKENIZER="$(find "$STAGE3_DIR" -type f -name tokenizer_lecarnet_ctk2.bin -print -quit)"
          MANIFEST="$(find "$STAGE3_DIR" -type f -name lecarnet-export-manifest.json -print -quit)"
          test -n "$MODEL" && test -s "$MODEL"
          test -n "$TOKENIZER" && test -s "$TOKENIZER"
          test -n "$MANIFEST" && test -s "$MANIFEST"

          echo "99f5b02e550d2de461003aa312dbbaf0e6e4bd2744f082472e8103bd0f91fc45  $MODEL" | sha256sum --check
          echo "e707eaa72c56acb1f73ef2a7f6d89327875c22d9301be5e58ebca8eac3168f5b  $TOKENIZER" | sha256sum --check

          mkdir -p firmware/src/hawkins_llm/assets
          cp "$MODEL" firmware/src/hawkins_llm/assets/model_lecarnet_q4.bin
          cp "$TOKENIZER" firmware/src/hawkins_llm/assets/tokenizer_lecarnet_ctk2.bin
          cp "$MANIFEST" firmware/src/hawkins_llm/assets/model_manifest.json
          (
            cd firmware/src/hawkins_llm/assets
            sha256sum model_lecarnet_q4.bin tokenizer_lecarnet_ctk2.bin > SHA256SUMS.txt
          )

          git fetch origin main
          git checkout -B main origin/main
          git add firmware/src/hawkins_llm/assets/model_lecarnet_q4.bin \
                  firmware/src/hawkins_llm/assets/tokenizer_lecarnet_ctk2.bin \
                  firmware/src/hawkins_llm/assets/model_manifest.json \
                  firmware/src/hawkins_llm/assets/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish final Hawkins LeCarnet model assets"
            git push origin HEAD:main
          fi
