name: ROZA NucleoOS + Launcher ESP-IDF Integration

on:
  push:
    branches:
      - migration/roza-chanina-launcher
    paths:
      - ".gitmodules"
      - "nucleoos"
      - "launcher"
      - "integration/nucleoos-bridge/**"
      - "tools/installer/**"
      - "docs/INSTALL-ROZA-FR.md"
      - "third_party/licenses/**"
      - "integration/arduino-idf-smoke/components/launcher_platform/**"
      - ".github/workflows/roza-nucleoos-bridge.yml"
      - "docs/FUSION-ROZA-NUCLEOOS.md"
      - "scripts/apply-roza-nucleoos.py"
      - "scripts/apply-roza-displaydrivers.py"
      - "scripts/prepare-roza-arduino-usb.py"
      - "scripts/check-roza-fusion-contract.py"
      - "scripts/create-roza-build-manifest.py"
      - "scripts/verify-roza-flash-image.py"
      - "docs/FLASH-PREVIEW-NOT-READY.md"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roza-nucleoos-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ROZA unified Cardputer ADV firmware candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ROZA source without downloading large submodules
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Initialize the pinned Launcher submodule
        run: git submodule update --init --recursive launcher

      - name: Adapt the real Launcher M5GFX backend to NucleoOS display ownership
        shell: bash
        run: |
          python3 -m py_compile scripts/apply-roza-displaydrivers.py
          python3 scripts/apply-roza-displaydrivers.py
          python3 scripts/apply-roza-displaydrivers.py
          python3 tests/test_roza_display_backend_patch.py

      - name: Fetch only the NucleoOS firmware tree
        shell: bash
        run: |
          nucleoos_commit=cb0f1a5356ddd6f96ec6b31bbcba5d55f52d8123
          git clone --filter=blob:none --no-checkout --depth=1 --single-branch --branch main https://github.com/indecenti/NucleoOs.git nucleoos
          git -C nucleoos sparse-checkout init --cone
          git -C nucleoos sparse-checkout set firmware sdk/native tools/anima-host
          if ! git -C nucleoos cat-file -e "${nucleoos_commit}^{commit}"; then
            git -C nucleoos fetch --filter=blob:none --depth=1 origin "${nucleoos_commit}"
          fi
          git -C nucleoos checkout --detach "${nucleoos_commit}"
          test "$(git -C nucleoos rev-parse HEAD)" = "${nucleoos_commit}"
          test -f nucleoos/LICENSE
          test -f nucleoos/firmware/main/main.c
          test -f nucleoos/sdk/native/include/nucleo_native.h
          test -f nucleoos/tools/anima-host/tts-plan-ctest.c

      - name: Apply ROZA theme and boot identity to NucleoOS source
        shell: bash
        run: |
          python3 -m py_compile scripts/apply-roza-nucleoos.py
          python3 scripts/apply-roza-nucleoos.py
          python3 scripts/apply-roza-nucleoos.py
          git -C nucleoos diff --check

      - name: Verify ROZA fusion safety and feature contract
        run: |
          python3 -m py_compile \
            scripts/check-roza-fusion-contract.py \
            scripts/verify-roza-flash-image.py \
            scripts/create-roza-build-manifest.py
          python3 scripts/check-roza-fusion-contract.py

      - name: Test Launcher input translation on the host
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -I integration/nucleoos-bridge/components/roza_launcher_hal/include \
            -I nucleoos/firmware/components/nucleo_kbd/include \
            integration/nucleoos-bridge/components/roza_launcher_hal/roza_launcher_input.cpp \
            tests/roza_launcher_input_test.cpp \
            -o /tmp/roza-launcher-input-test
          /tmp/roza-launcher-input-test

      - name: Test Cap LoRa-1262 GNSS NMEA parser on the host
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -I integration/nucleoos-bridge/components/roza_gnss/include \
            integration/nucleoos-bridge/components/roza_gnss/roza_gnss_nmea.cpp \
            tests/roza_gnss_nmea_test.cpp \
            -o /tmp/roza-gnss-nmea-test
          /tmp/roza-gnss-nmea-test

      - name: Compile the combined ESP-IDF component graph
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.4
          target: esp32s3
          path: integration/nucleoos-bridge
          command: >-
            idf.py reconfigure &&
            python3 ../../scripts/prepare-roza-arduino-usb.py &&
            idf.py build &&
            idf.py merge-bin -o ROZA-ESP32S3-FLASH-PREVIEW.bin

      - name: Verify merged ESP32-S3 flash image and flash offsets
        run: |
          python3 scripts/verify-roza-flash-image.py \
            --build-dir integration/nucleoos-bridge/build \
            --image ROZA-ESP32S3-FLASH-PREVIEW.bin \
            --flash-args integration/nucleoos-bridge/build/flash_args \
            --partition-csv integration/nucleoos-bridge/partitions.csv
          cp integration/nucleoos-bridge/build/ROZA-ESP32S3-FLASH-PREVIEW.bin ROZA-Cardputer-ADV-FULL.bin

      - name: Generate complete device-test manifest and SHA-256 checksums
        run: |
          python3 scripts/create-roza-build-manifest.py \
            --build-dir integration/nucleoos-bridge/build \
            --partition-csv integration/nucleoos-bridge/partitions.csv \
            --output ROZA-BUILD-INFO.json

      - name: Refuse flashing of an unvalidated device candidate
        shell: bash
        run: |
          set -euo pipefail
          if output="$(bash tools/installer/flash.sh ROZA-Cardputer-ADV-FULL.bin 2>&1)"; then
            echo "ERREUR : le candidat non validé a passé le contrôle de flash." >&2
            exit 1
          fi
          grep -q "REFUS DE FLASH" <<< "$output"
          printf '%s\n' "$output"

      - name: Test installer approval and refusal paths without hardware access
        run: python3 tests/test_flash_installer_guard.py

      - name: Assemble one self-contained installation package
        shell: bash
        run: |
          set -euo pipefail
          package="dist/ROZA-Cardputer-ADV"
          mkdir -p "$package/audit"
          cp ROZA-Cardputer-ADV-FULL.bin "$package/"
          cp ROZA-BUILD-INFO.json "$package/"
          cp integration/nucleoos-bridge/build/flash_args "$package/"
          cp tools/installer/flash.sh "$package/flash.sh"
          cp docs/INSTALL-ROZA-FR.md "$package/INSTALL.md"
          cp docs/FUSION-ROZA-NUCLEOOS.md "$package/FUSION-DETAILS.md"
          cp launcher/LICENSE "$package/LICENSE-Launcher-MIT.txt"
          cp nucleoos/LICENSE "$package/LICENSE-NucleoOS.txt"
          cp third_party/licenses/RadioLib-7.8.0-MIT.txt "$package/LICENSE-RadioLib-MIT.txt"
          cp integration/nucleoos-bridge/build/ROZA-ESP32S3-FLASH-PREVIEW.bin "$package/audit/"
          cp integration/nucleoos-bridge/build/roza_nucleoos_launcher_bridge.bin "$package/audit/"
          cp integration/nucleoos-bridge/build/roza_nucleoos_launcher_bridge.elf "$package/audit/"
          cp integration/nucleoos-bridge/build/bootloader/bootloader.bin "$package/audit/"
          cp integration/nucleoos-bridge/build/partition_table/partition-table.bin "$package/audit/"
          cp integration/nucleoos-bridge/build/ota_data_initial.bin "$package/audit/"
          cp integration/nucleoos-bridge/partitions.csv "$package/audit/"
          cp integration/nucleoos-bridge/dependencies.lock "$package/audit/"
          chmod +x "$package/flash.sh"
          test -s "$package/ROZA-Cardputer-ADV-FULL.bin"
          test -s "$package/ROZA-BUILD-INFO.json"
          test -s "$package/flash.sh"

      - name: Publish complete ROZA Cardputer ADV software test candidate
        uses: actions/upload-artifact@v4
        with:
          name: ROZA-CARDPUTER-ADV-FIRMWARE-TEST-CANDIDATE-${{ github.sha }}
          path: |
            dist/ROZA-Cardputer-ADV/
          if-no-files-found: error
          retention-days: 90
