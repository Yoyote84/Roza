# ROZA — Surveillance des GitHub Actions
# Détecte les échecs, classe les erreurs, max 3 tentatives.
# Affiche rapport honnête. Pas de faux résultats vert.

name: ROZA Monitor

on:
  workflow_run:
    workflows: ["ROZA Firmware Build"]
    types: [failed]
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: classifier
        run: echo "Classification non automatique : besoin d'humain"
      - name: report
        run: echo "Rapport : voir GitHub Actions"