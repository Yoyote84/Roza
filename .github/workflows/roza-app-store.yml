name: ROZA App Manager Build

on:
  push:
    branches:
      - feature/roza-sd-app-manager
    paths:
      - "firmware/**"
      - ".github/workflows/roza-app-store.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilation Cardputer ADV
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==6.1.6"

      - name: Compiler ROZA
        working-directory: firmware
        run: platformio run -e cardputer-adv
