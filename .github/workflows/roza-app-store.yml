name: ROZA App Manager Build

on:
  push:
    branches:
      - feature/roza-sd-app-manager
    paths:
      - "firmware/**"
      - "roza-app-catalog/**"
      - "tools/validate_roza_catalog.py"
      - ".github/workflows/roza-app-store.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-catalog:
    name: Validate catalogue and SHA-256
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Vérifier les paquets ROZA
        run: python tools/validate_roza_catalog.py

  build:
    name: Compilation Cardputer ADV
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==6.1.6"
      - name: Compiler ROZA
        working-directory: firmware
        run: platformio run -e cardputer-adv
      - name: Publier le firmware compile
        uses: actions/upload-artifact@v4
        with:
          name: ROZA-Cardputer-ADV-${{ github.sha }}
          path: firmware/.pio/build/cardputer-adv/firmware.bin
          if-no-files-found: error
          retention-days: 14
