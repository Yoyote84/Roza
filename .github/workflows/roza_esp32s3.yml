# Github Actions Workflow for ROZA Firmware
# Compile le firmware ROZA sur PlatformIO pour ESP32-S3

name: ROZA Firmware Build

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "README.md"
      - ".github/workflows/roza_esp32s3.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - "README.md"
      - ".github/workflows/roza_esp32s3.yml"
  workflow_dispatch:

env:
  # Version de PlatformIO à installer (omettre "latest" non valide pour pip)
  PLATFORMIO_VERSION: 6.1.6

permissions:
  contents: read

concurrency:
  group: roza-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilation PlatformIO (Cardputer ADV)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: firmware
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer PlatformIO via pip
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Compiler le firmware avec PlatformIO
        run: |
          platformio run -e cardputer-adv

      - name: Vérifier la génération des binaires
        run: |
          BUILD_DIR=".pio/build/cardputer-adv"
          for file in firmware.bin firmware.elf bootloader.bin partitions.bin; do
            if [ ! -s "$BUILD_DIR/$file" ]; then
              echo "::error::Fichier de compilation absent ou vide : $BUILD_DIR/$file"
              exit 1
            fi
          done
          ls -lh "$BUILD_DIR/firmware.bin" "$BUILD_DIR/firmware.elf" "$BUILD_DIR/bootloader.bin" "$BUILD_DIR/partitions.bin"

      - name: Publier les artefacts de compilation
        uses: actions/upload-artifact@v4
        with:
          name: roza-cardputer-adv-${{ github.sha }}
          path: |
            firmware/.pio/build/cardputer-adv/firmware.elf
            firmware/.pio/build/cardputer-adv/firmware.bin
            firmware/.pio/build/cardputer-adv/bootloader.bin
            firmware/.pio/build/cardputer-adv/partitions.bin
          if-no-files-found: error
          retention-days: 14

      - name: Publier la taille du binaire
        run: |
          BINARY_SIZE=$(stat -c%s .pio/build/cardputer-adv/firmware.bin)
          echo "Binary size: $BINARY_SIZE bytes"