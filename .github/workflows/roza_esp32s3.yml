# Github Actions Workflow for ROZA Firmware
# Compile le firmware ROZA sur PlatformIO pour ESP32-S3

name: ROZA Firmware Build

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "README.md"
      - ".github/workflows/roza_esp32s3.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - "README.md"
      - ".github/workflows/roza_esp32s3.yml"
  workflow_dispatch:

env:
  # Version de PlatformIO à utiliser
  PLATFORMIO_VERSION: latest

permissions:
  contents: read

concurrency:
  group: roza-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilation PlatformIO (Cardputer ADV)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: firmware
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer PlatformIO via pip
        run: |
          python -m pip install --upgrade pip
          pip install platformio==${{ env.PLATFORMIO_VERSION }}

      - name: Compiler le firmware avec PlatformIO
        run: |
          platformio run -e cardputer-adv

      - name: Vérifier la génération des binaires
        run: |
          ls -la .pioenvs/cardputer-adv/

      - name: Publier les artefacts de compilation
        uses: actions/upload-artifact@v4
        with:
          name: roza-cardputer-adv-${{ github.sha }}
          path: |
            .pioenvs/cardputer-adv/firmware.elf
            .pioenvs/cardputer-adv/firmware.bin
            .pioenvs/cardputer-adv/bootloader.elf
            .pioenvs/cardputer-adv/bootloader.bin
            .pioenvs/cardputer-adv/partition_table.elf
            .pioenvs/cardputer-adv/partition_table.bin
          if-no-files-found: error
          retention-days: 14

      - name: Publier la taille du binaire
        run: |
          BINARY_SIZE=$(stat -c%s .pioenvs/cardputer-adv/firmware.bin 2>/dev/null || echo "unknown")
          echo "Binary size: $BINARY_SIZE bytes"