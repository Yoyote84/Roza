# Github Actions Workflow for ROZA Firmware
# Compile le firmware ROZA sur ESP-IDF stable pour ESP32-S3.

name: ROZA Firmware Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Version explicite d'ESP-IDF à utiliser
  ESP_IDF_VERSION: v5.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # === ÉTAPE 1 : Installation complète d'ESP-IDF AVANT export.sh ===
      - name: Install ESP-IDF (avant export)
        run: |
          # On clone d'abord
          git clone --depth 1 --branch $ESP_IDF_VERSION https://github.com/espressif/esp-idf.git /opt/esp-idf
          
          # Puis on installe TOUTES les outils AVANT de sourcer export.sh
          # Cela garantit que tous les outils (gdb, python, etc.) sont disponibles
          cd /opt/esp-idf
          ./install.sh
          
          # Maintenant on peut sourcer export.sh en toute sécurité
          # (cette fois-ci, tous les outils seront dans le PATH)
          source /opt/esp-idf/export.sh

      - name: Vérifier l'installation d'ESP-IDF
        run: |
          source /opt/esp-idf/export.sh
          idf.py --version
          # Vérifier les outils critiques
          which xtensa-esp-elf-gdb || echo "ATTENTION : xtensa-esp-elf-gdb non trouvé dans le PATH"
          which riscv32-esp-elf-gdb || echo "ATTENTION : riscv32-esp-elf-gdb non trouvé dans le PATH"

      - name: Installer les dépendances Python
        run: |
          pip install west

      - name: Configurer le projet
        run: |
          source /opt/esp-idf/export.sh
          cd /public/Roza
          idf.py set-target esp32s3
          # Configuration minimale requise (sans modifier l'utilisateur sans besoin)
          idf.py menuconfig --set-options "make.applealu.enabled=no"

      - name: Compiler le firmware
        run: |
          source /opt/esp-idf/export.sh
          cd /public/Roza
          idf.py build --check

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ROZA-firmware-${{ github.sha }}
          path: /public/Roza/build/*
          if-no-files-found: warn