# Github Actions Workflow for ROZA Firmware
# Compile le firmware ROZA sur PlatformIO pour ESP32-S3

name: ROZA Firmware Build

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - "firmware/docs/**"
      - ".github/workflows/roza_esp32s3.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - "README.md"
      - ".github/workflows/roza_esp32s3.yml"
  workflow_dispatch:

env:
  # Version de PlatformIO à installer (omettre "latest" non valide pour pip)
  PLATFORMIO_VERSION: 6.1.6

permissions:
  contents: read

concurrency:
  group: roza-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilation PlatformIO (Cardputer ADV)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: firmware
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer PlatformIO via pip
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Compiler le firmware avec PlatformIO
        run: |
          platformio run -e cardputer-adv

      - name: Exécuter les tests logiciels hors matériel
        run: |
          set -euo pipefail
          for suite in irtest loratest odidtest gnsstest jsontest oventest powertest ramtest astrotest calctest clocktest; do
            echo "::group::Suite $suite"
            bash "tools/$suite/build.sh"
            echo "::endgroup::"
          done
          JSON_INC="-I .pio/libdeps/cardputer-adv/ArduinoJson/src"
          for test in test alert_test hist_test hosts_test opid_test radar_test; do
            echo "::group::Router/RID $test"
            g++ -std=c++17 $JSON_INC "tools/routertest/$test.cpp" -o "/tmp/roza-$test"
            "/tmp/roza-$test"
            echo "::endgroup::"
          done
          echo "::group::Autotest du balayage mémoire (sans matériel)"
          python tools/memsweep.py --selftest
          echo "::endgroup::"

      - name: Vérifier la génération des binaires
        run: |
          BUILD_DIR=".pio/build/cardputer-adv"
          for file in firmware.bin firmware.elf bootloader.bin partitions.bin; do
            if [ ! -s "$BUILD_DIR/$file" ]; then
              echo "::error::Fichier de compilation absent ou vide : $BUILD_DIR/$file"
              exit 1
            fi
          done
          ls -lh "$BUILD_DIR/firmware.bin" "$BUILD_DIR/firmware.elf" "$BUILD_DIR/bootloader.bin" "$BUILD_DIR/partitions.bin"

      - name: Préparer l'image unique à flasher
        run: |
          python tools/package_flash.py \
            --build-dir .pio/build/cardputer-adv \
            --output-dir .pio/build/cardputer-adv/flash-package
      - name: Publier le paquet prêt à flasher
        uses: actions/upload-artifact@v4
        with:
          name: roza-cardputer-adv-flash-${{ github.sha }}
          path: |
            firmware/.pio/build/cardputer-adv/flash-package/roza-cardputer-adv-8mb.bin
            firmware/.pio/build/cardputer-adv/flash-package/FLASH-INFO.txt
            firmware/.pio/build/cardputer-adv/flash-package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publier les artefacts de compilation
        uses: actions/upload-artifact@v4
        with:
          name: roza-cardputer-adv-${{ github.sha }}
          path: |
            firmware/.pio/build/cardputer-adv/firmware.elf
            firmware/.pio/build/cardputer-adv/firmware.bin
            firmware/.pio/build/cardputer-adv/bootloader.bin
            firmware/.pio/build/cardputer-adv/partitions.bin
          if-no-files-found: error
          retention-days: 14

      - name: Publier la taille du binaire
        run: |
          BINARY_SIZE=$(stat -c%s .pio/build/cardputer-adv/firmware.bin)
          echo "Binary size: $BINARY_SIZE bytes"