name: ROZA Firmware Build

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/roza_esp32s3.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/roza_esp32s3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roza-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilation ESP32-S3 (ESP-IDF 5.5.1)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: firmware
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier l'environnement ESP-IDF
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --version
          python --version

      - name: Compiler le firmware ROZA
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build

      - name: Publier les artefacts de compilation
        uses: actions/upload-artifact@v4
        with:
          name: roza-esp32s3-${{ github.sha }}
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
          if-no-files-found: error
          retention-days: 14
