name: ROZA Firmware Build

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "README.md"
      - ".github/workflows/roza_esp32s3.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - "README.md"
      - ".github/workflows/roza_esp32s3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roza-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PlatformIO build (Cardputer ADV / ESP32-S3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Show PlatformIO version
        run: pio --version

      - name: Compile firmware
        working-directory: firmware
        run: pio run -e cardputer-adv

      - name: Verify generated binaries
        working-directory: firmware
        run: |
          test -s .pio/build/cardputer-adv/firmware.bin
          test -s .pio/build/cardputer-adv/bootloader.bin
          test -s .pio/build/cardputer-adv/partitions.bin
          ls -lh .pio/build/cardputer-adv/*.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roza-cardputer-adv-${{ github.sha }}
          path: firmware/.pio/build/cardputer-adv/*.bin
          if-no-files-found: error
          retention-days: 14
