name: ROZA Web Screen Viewer + Cardputer ADV firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/src/**"
      - "firmware/tools/uisim/**"
      - "firmware/platformio.ini"
      - "firmware/partitions_8MB.csv"
      - "firmware/sdkconfig.defaults"
      - "firmware/tools/ota_security_test.py"
      - "firmware/tools/create_ota_manifest.py"
      - ".github/workflows/roza-web-viewer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: roza-web-viewer-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build firmware and render ROZA screens
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install "platformio==6.2.0"

      - name: Cache PlatformIO toolchains and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
            firmware/.pio/libdeps/cardputer-adv
            firmware/.pio/build/cardputer-adv
          key: roza-platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/sdkconfig.defaults', 'firmware/tools/roza_build_info.py') }}

      - name: Verify PlatformIO and resolved dependency versions
        working-directory: firmware
        run: |
          pio --version
          pio pkg list -e cardputer-adv

      - name: Install firmware libraries
        working-directory: firmware
        run: pio pkg install -e cardputer-adv

      - name: Prepare build-only secrets
        working-directory: firmware
        run: cp src/secrets.h.example src/secrets.h

      - name: Vérifier l'absence des anciens composants du jeu retiré
        working-directory: firmware
        run: python tools/roza_feature_cleanup_test.py

      - name: Diagnostiquer les en-têtes Bluetooth de l'environnement ESP32-S3
        shell: bash
        run: |
          set -euo pipefail
          echo "Paquets SDK / Arduino installés :"
          find "$HOME/.platformio/packages" -maxdepth 2 -type d -name 'framework-arduinoespressif32*' -print
          echo "En-tête Bluedroid :"
          find "$HOME/.platformio/packages" -type f -name 'esp_bt_main.h' -print
          echo "En-têtes BLE associés :"
          find "$HOME/.platformio/packages" -type f -name 'esp_bt.h' -print
          find "$HOME/.platformio/packages" -type f -name 'esp_gap_ble_api.h' -print
          find "$HOME/.platformio/packages" -type f -name 'esp_ble_gap_api.h' -print
          echo "Options Bluetooth exposées par sdkconfig :"
          find "$HOME/.platformio/packages" -type f -name 'sdkconfig.h' -print0 | while IFS= read -r -d '' f; do
            if grep -qE 'CONFIG_(BT_ENABLED|BLUEDROID_ENABLED|BT_BLUEDROID_ENABLED)' "$f"; then
              echo "---- $f"
              grep -E 'CONFIG_(BT_ENABLED|BLUEDROID_ENABLED|BT_BLUEDROID_ENABLED)' "$f" || true
            fi
          done

      - name: Compile firmware Cardputer ADV
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          pio run -e cardputer-adv 2>&1 | tee "$RUNNER_TEMP/platformio-memory-report.txt"


      - name: Run software regression suites
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          for suite in irtest loratest odidtest gnsstest jsontest oventest powertest ramtest astrotest calctest clocktest; do
            echo "::group::Suite $suite"
            bash "tools/$suite/build.sh"
            echo "::endgroup::"
          done
          JSON_INC="-I .pio/libdeps/cardputer-adv/ArduinoJson/src"
          for test in test alert_test hist_test hosts_test opid_test radar_test; do
            echo "::group::Router/RID $test"
            g++ -std=c++17 $JSON_INC "tools/routertest/$test.cpp" -o "/tmp/roza-$test"
            "/tmp/roza-$test"
            echo "::endgroup::"
          done
          echo "::group::Memory sweep self-test"
          python tools/memsweep.py --selftest
          echo "::endgroup::"
          echo "::group::NimBLE static migration test"
          python tools/bt_nimble_static_test.py
          echo "::endgroup::"
          echo "::group::Stage-2 application modernization contracts"
          python tools/app_modernization_contract_test.py
          echo "::endgroup::"
          echo "::group::Flash package guard tests"
          python tools/package_flash_test.py
          echo "::endgroup::"
          echo "::group::OTA signature and partition security tests"
          python tools/ota_security_test.py
          echo "::endgroup::"
      - name: Assemble flashable Cardputer ADV images
        working-directory: firmware
        shell: bash
        env:
          ROZA_OTA_SIGNING_KEY_PEM: ${{ secrets.ROZA_OTA_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          BUILD=".pio/build/cardputer-adv"
          PACKAGE="$RUNNER_TEMP/roza-firmware-package"
          PIO_REPORT="$RUNNER_TEMP/platformio-memory-report.txt"
          APP_PARTITION_BYTES=$((0x3F0000))
          FLASH_BYTES=$((8 * 1024 * 1024))
          mkdir -p "$PACKAGE"

          for file in bootloader.bin partitions.bin firmware.bin firmware.elf; do
            test -s "$BUILD/$file" || {
              echo "::error::Missing expected PlatformIO output: $BUILD/$file"
              find "$BUILD" -maxdepth 2 -type f \( -name '*.bin' -o -name '*.elf' \) -print
              exit 1
            }
          done
          test -s "$PIO_REPORT" || {
            echo "::error::PlatformIO memory report is missing"
            exit 1
          }

          RAM_LINE="$(grep -E '^RAM:' "$PIO_REPORT" | tail -n 1 || true)"
          FLASH_LINE="$(grep -E '^Flash:' "$PIO_REPORT" | tail -n 1 || true)"
          test -n "$RAM_LINE" || {
            echo "::error::PlatformIO RAM usage summary was not found"
            exit 1
          }
          test -n "$FLASH_LINE" || {
            echo "::error::PlatformIO Flash usage summary was not found"
            exit 1
          }
          printf '%s\n%s\n' "$RAM_LINE" "$FLASH_LINE" > "$PACKAGE/PLATFORMIO_MEMORY.txt"
          cp "$PIO_REPORT" "$PACKAGE/PLATFORMIO_BUILD_REPORT.txt"

          FIRMWARE_BYTES="$(stat -c '%s' "$BUILD/firmware.bin")"
          if (( FIRMWARE_BYTES > APP_PARTITION_BYTES )); then
            echo "::error::Firmware image ($FIRMWARE_BYTES bytes) exceeds the OTA app slot ($APP_PARTITION_BYTES bytes)"
            exit 1
          fi

          SIZE_TOOL="$(find "$HOME/.platformio/packages" -type f -name 'xtensa-esp32s3-elf-size' -print -quit)"
          test -n "$SIZE_TOOL" || {
            echo "::error::xtensa-esp32s3-elf-size was not found"
            exit 1
          }
          "$SIZE_TOOL" -A "$BUILD/firmware.elf" > "$PACKAGE/ELF_SECTIONS.txt"

          # pioarduino 55.03.313 fournit esptool 5.6.0 comme outil de build.
          # Le package PlatformIO expose esptool.py sans installer ses dépendances
          # Python dans l'interpréteur système du runner. Installer la même version
          # depuis PyPI pour récupérer son environnement complet, sans flottement.
          python -m pip install --disable-pip-version-check "esptool==5.6.0"
          python -m esptool --help >/dev/null

          # OTA_0 démarre à 0x20000 ; l'image complète est destinée au flash USB.
          python -m esptool --chip esp32s3 merge-bin \
            --output "$PACKAGE/ROZA-Cardputer-ADV-full-flash.bin" \
            --flash-mode keep \
            --flash-size 8MB \
            0x0 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0x20000 "$BUILD/firmware.bin"

          cp "$BUILD/firmware.bin" "$PACKAGE/firmware.bin"
          cp "$BUILD/bootloader.bin" "$PACKAGE/bootloader.bin"
          cp "$BUILD/partitions.bin" "$PACKAGE/partitions.bin"
          cp "$GITHUB_WORKSPACE/firmware/tools/migrate_to_ota.sh" "$PACKAGE/migrate_to_ota.sh"
          chmod +x "$PACKAGE/migrate_to_ota.sh"

          # Signing key is scoped to this step and never uploaded as an artifact.
          if [[ -n "$ROZA_OTA_SIGNING_KEY_PEM" ]]; then
            printf '%s\n' "$ROZA_OTA_SIGNING_KEY_PEM" > "$RUNNER_TEMP/roza-ota-signing-key.pem"
            cp "$BUILD/firmware.bin" "$PACKAGE/ROZA-OTA.bin"
            python "$GITHUB_WORKSPACE/firmware/tools/create_ota_manifest.py" \
              --firmware "$PACKAGE/ROZA-OTA.bin" \
              --private-key "$RUNNER_TEMP/roza-ota-signing-key.pem" \
              --output "$PACKAGE/ota-manifest.json" \
              --build-number "$GITHUB_RUN_NUMBER" \
              --commit "$GITHUB_SHA"
            rm -f "$RUNNER_TEMP/roza-ota-signing-key.pem"
          else
            echo "::warning::ROZA_OTA_SIGNING_KEY_PEM absent: no unsigned OTA will be published."
          fi

          export FIRMWARE_BYTES APP_PARTITION_BYTES FLASH_BYTES RAM_LINE FLASH_LINE
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          firmware_bytes = int(os.environ["FIRMWARE_BYTES"])
          app_partition_bytes = int(os.environ["APP_PARTITION_BYTES"])
          flash_bytes = int(os.environ["FLASH_BYTES"])
          manifest = {
              "status": "full_flash_image_built_ci_hardware_test_pending",
              "commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "target": {
                  "board": "M5Stack Cardputer ADV",
                  "mcu": "ESP32-S3FN8",
                  "flash_bytes": flash_bytes,
                  "psram": False
              },
              "full_flash_image": {
                  "filename": "ROZA-Cardputer-ADV-full-flash.bin",
                  "flash_address": "0x0000",
                  "application_offset": "0x20000"
              },
              "application_partition": {
                  "type": "ota_0",
                  "offset": "0x20000",
                  "bytes": app_partition_bytes,
                  "firmware_bin_bytes": firmware_bytes,
                  "remaining_binary_bytes": app_partition_bytes - firmware_bytes
              },
              "ota_layout": {
                  "otadata_offset": "0xF000",
                  "otadata_bytes": 8192,
                  "ota_0_offset": "0x20000",
                  "ota_1_offset": "0x410000",
                  "each_slot_bytes": app_partition_bytes,
                  "rollback_enabled_in_sdkconfig": True
              },
              "platformio_linked_memory_summary": {
                  "ram": os.environ["RAM_LINE"],
                  "flash": os.environ["FLASH_LINE"],
                  "note": "Usage statique liee au build PlatformIO, pas une mesure du heap libre en fonctionnement."
              },
              "hardware_validation": {
                  "tested_on_physical_cardputer": False
              }
          }
          Path(os.environ["RUNNER_TEMP"], "roza-firmware-package", "BUILD_MANIFEST.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

          cat > "$PACKAGE/INSTALLATION.txt" <<'EOF'
          ROZA — M5Stack Cardputer ADV (ESP32-S3FN8, 8 MB Flash, sans PSRAM)

          IMAGE COMPLETE USB
          ROZA-Cardputer-ADV-full-flash.bin — adresse 0x0000 (réinitialise NVS)

          MIGRATION USB QUI CONSERVE LES REGLAGES
          Vérifier SHA256SUMS-migration.txt puis lancer migrate_to_ota.sh avec
          le port série du Cardputer. Le script exige une confirmation et efface
          uniquement otadata à 0xF000 / 0x2000. Il écrit ensuite bootloader,
          table et firmware dans OTA_0 à 0x20000. NVS reste à 0x9000 / 0x5000 ;
          la microSD n'est jamais touchée.

          Fichiers séparés : bootloader.bin, partitions.bin, firmware.bin.
          Ne pas flasher firmware.bin seul après cette migration initiale.

          BUILD_MANIFEST.json décrit les deux slots OTA et les mesures du build.
          La compilation CI ne remplace pas un essai sur le Cardputer ADV réel.
          EOF

          (cd "$PACKAGE" && sha256sum bootloader.bin partitions.bin firmware.bin migrate_to_ota.sh > SHA256SUMS-migration.txt)
          (cd "$PACKAGE" && sha256sum *.bin BUILD_MANIFEST.json PLATFORMIO_MEMORY.txt PLATFORMIO_BUILD_REPORT.txt ELF_SECTIONS.txt INSTALLATION.txt migrate_to_ota.sh SHA256SUMS-migration.txt > SHA256SUMS.txt)
          if [[ -s "$PACKAGE/ota-manifest.json" ]]; then
            (cd "$PACKAGE" && sha256sum ota-manifest.json >> SHA256SUMS.txt)
          fi
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS.txt)
          ls -lh "$PACKAGE"

      - name: Upload flashable firmware package
        uses: actions/upload-artifact@v4
        with:
          name: ROZA-Cardputer-ADV-${{ github.sha }}
          path: ${{ runner.temp }}/roza-firmware-package/
          if-no-files-found: error
          retention-days: 90

      - name: Prepare optional simulator-only credentials
        working-directory: firmware
        run: |
          cp src/secrets.h.example src/secrets.h
          sed -i 's/#define N2YO_API_KEY ""/#define N2YO_API_KEY "SIMULATOR"/' src/secrets.h

      - name: Render screens using firmware drawing code
        working-directory: firmware/tools/uisim
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Assemble static web app and firmware download
        working-directory: firmware/tools/uisim
        run: |
          chmod +x web/build-site.sh
          ./web/build-site.sh "$GITHUB_WORKSPACE/site"
          mkdir -p "$GITHUB_WORKSPACE/site/downloads"
          cp "$RUNNER_TEMP/roza-firmware-package/ROZA-Cardputer-ADV-full-flash.bin" \
            "$GITHUB_WORKSPACE/site/downloads/ROZA-Cardputer-ADV-full-flash.bin"
          mkdir -p "$GITHUB_WORKSPACE/site/downloads/migration"
          cp "$RUNNER_TEMP/roza-firmware-package/bootloader.bin" \
            "$RUNNER_TEMP/roza-firmware-package/partitions.bin" \
            "$RUNNER_TEMP/roza-firmware-package/firmware.bin" \
            "$RUNNER_TEMP/roza-firmware-package/migrate_to_ota.sh" \
            "$GITHUB_WORKSPACE/site/downloads/migration/"
          cp "$RUNNER_TEMP/roza-firmware-package/SHA256SUMS-migration.txt" \
            "$GITHUB_WORKSPACE/site/downloads/migration/"
          if [[ -s "$RUNNER_TEMP/roza-firmware-package/ota-manifest.json" ]]; then
            cp "$RUNNER_TEMP/roza-firmware-package/ROZA-OTA.bin" \
              "$RUNNER_TEMP/roza-firmware-package/ota-manifest.json" \
              "$GITHUB_WORKSPACE/site/downloads/"
          fi
          cp "$RUNNER_TEMP/roza-firmware-package/INSTALLATION.txt" \
            "$GITHUB_WORKSPACE/site/downloads/INSTALLATION.txt"
          cp "$RUNNER_TEMP/roza-firmware-package/BUILD_MANIFEST.json" \
            "$GITHUB_WORKSPACE/site/downloads/BUILD_MANIFEST.json"
          cp "$RUNNER_TEMP/roza-firmware-package/SHA256SUMS.txt" \
            "$GITHUB_WORKSPACE/site/downloads/SHA256SUMS.txt"
          cp "$GITHUB_WORKSPACE/firmware/docs/FLASHING.md" \
            "$GITHUB_WORKSPACE/site/downloads/FLASHING.md"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish web viewer and firmware
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
