name: ROZA Web Screen Viewer

on:
  push:
    branches: [main]
    paths:
      - "firmware/src/**"
      - "firmware/tools/uisim/**"
      - "firmware/platformio.ini"
      - ".github/workflows/roza-web-viewer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: roza-web-viewer-pages
  cancel-in-progress: true

jobs:
  build:
    name: Render genuine ROZA screens
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install "platformio==6.1.6"

      - name: Install firmware libraries
        working-directory: firmware
        run: pio pkg install -e cardputer-adv

      - name: Prepare optional simulator-only credentials
        working-directory: firmware
        run: |
          cp src/secrets.h.example src/secrets.h
          sed -i 's/#define N2YO_API_KEY ""/#define N2YO_API_KEY "SIMULATOR"/' src/secrets.h

      - name: Render screens using firmware drawing code
        working-directory: firmware/tools/uisim
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Assemble static web app
        working-directory: firmware/tools/uisim
        run: |
          chmod +x web/build-site.sh
          ./web/build-site.sh "$GITHUB_WORKSPACE/site"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish web viewer
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
