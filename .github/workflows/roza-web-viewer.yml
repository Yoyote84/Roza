name: ROZA Web Screen Viewer + Cardputer ADV firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/src/**"
      - "docs/HAWKINS_INSTALLATION.md"
      - ".github/workflows/hawkins-ai-android.yml"
      - "firmware/tools/hawkinstest/**"
      - "firmware/tools/hawkinsaitest/**"
      - "firmware/tools/hawkinsllmtest/**"
      - "firmware/tools/uisim/**"
      - "firmware/platformio.ini"
      - "firmware/partitions_8MB.csv"
      - ".github/workflows/roza-web-viewer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: roza-web-viewer-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build firmware and render ROZA screens
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install "platformio==6.1.6"

      - name: Install firmware libraries
        working-directory: firmware
        run: pio pkg install -e cardputer-adv

      - name: Prepare build-only secrets
        working-directory: firmware
        run: cp src/secrets.h.example src/secrets.h

      - name: Compile firmware Cardputer ADV
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          pio run -e cardputer-adv 2>&1 | tee "$RUNNER_TEMP/platformio-memory-report.txt"

      - name: Verify LLM engine and SIMD kernel are linked
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          ELF=".pio/build/cardputer-adv/firmware.elf"
          NM="$(find "$HOME/.platformio/packages" -type f -name 'xtensa-esp32s3-elf-nm' -print -quit)"
          test -s "$ELF"
          test -n "$NM"
          "$NM" -C "$ELF" | grep -F "llm_init_embedded("
          "$NM" -C "$ELF" | grep -F "hawkinsLlmGetApi"
          "$NM" "$ELF" | grep -F "dot_q4q8_pie"

      - name: Assemble flashable Cardputer ADV images
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          BUILD=".pio/build/cardputer-adv"
          PACKAGE="$RUNNER_TEMP/roza-firmware-package"
          PIO_REPORT="$RUNNER_TEMP/platformio-memory-report.txt"
          APP_PARTITION_BYTES=$((0x7E0000))
          FLASH_BYTES=$((8 * 1024 * 1024))
          mkdir -p "$PACKAGE"

          for file in bootloader.bin partitions.bin firmware.bin firmware.elf; do
            test -s "$BUILD/$file" || {
              echo "::error::Missing expected PlatformIO output: $BUILD/$file"
              find "$BUILD" -maxdepth 2 -type f \( -name '*.bin' -o -name '*.elf' \) -print
              exit 1
            }
          done
          test -s "$PIO_REPORT" || {
            echo "::error::PlatformIO memory report is missing"
            exit 1
          }

          RAM_LINE="$(grep -E '^RAM:' "$PIO_REPORT" | tail -n 1 || true)"
          FLASH_LINE="$(grep -E '^Flash:' "$PIO_REPORT" | tail -n 1 || true)"
          test -n "$RAM_LINE" || {
            echo "::error::PlatformIO RAM usage summary was not found"
            exit 1
          }
          test -n "$FLASH_LINE" || {
            echo "::error::PlatformIO Flash usage summary was not found"
            exit 1
          }
          printf '%s\n%s\n' "$RAM_LINE" "$FLASH_LINE" > "$PACKAGE/PLATFORMIO_MEMORY.txt"
          cp "$PIO_REPORT" "$PACKAGE/PLATFORMIO_BUILD_REPORT.txt"

          FIRMWARE_BYTES="$(stat -c '%s' "$BUILD/firmware.bin")"
          if (( FIRMWARE_BYTES > APP_PARTITION_BYTES )); then
            echo "::error::Firmware image ($FIRMWARE_BYTES bytes) exceeds the factory app partition ($APP_PARTITION_BYTES bytes)"
            exit 1
          fi

          SIZE_TOOL="$(find "$HOME/.platformio/packages" -type f -name 'xtensa-esp32s3-elf-size' -print -quit)"
          test -n "$SIZE_TOOL" || {
            echo "::error::xtensa-esp32s3-elf-size was not found"
            exit 1
          }
          "$SIZE_TOOL" -A "$BUILD/firmware.elf" > "$PACKAGE/ELF_SECTIONS.txt"

          ESPTOOL="$(find "$HOME/.platformio/packages/tool-esptoolpy" -maxdepth 1 -type f -name 'esptool.py' -print -quit)"
          test -n "$ESPTOOL" || {
            echo "::error::PlatformIO esptool.py was not found"
            exit 1
          }

          # La partition factory commence a 0x10000 ; le binaire fusionne
          # contient bootloader + table + application et se flashe a 0x0000.
          python "$ESPTOOL" --chip esp32s3 merge_bin \
            --output "$PACKAGE/ROZA-Cardputer-ADV-Hawkins-factory.bin" \
            --flash_mode keep \
            --flash_size 8MB \
            0x0 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0x10000 "$BUILD/firmware.bin"

          cp "$BUILD/firmware.bin" "$PACKAGE/ROZA-Cardputer-ADV-Hawkins-application.bin"
          cp "$BUILD/bootloader.bin" "$PACKAGE/bootloader.bin"
          cp "$BUILD/partitions.bin" "$PACKAGE/partitions.bin"
          cp src/hawkins_llm/assets/model_manifest.json "$PACKAGE/model_manifest.json"
          cp src/hawkins_llm/assets/SHA256SUMS.txt "$PACKAGE/MODEL_SHA256SUMS.txt"

          export FIRMWARE_BYTES APP_PARTITION_BYTES FLASH_BYTES RAM_LINE FLASH_LINE
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          model_manifest = json.loads(
              Path("src/hawkins_llm/assets/model_manifest.json").read_text(encoding="utf-8")
          )
          firmware_bytes = int(os.environ["FIRMWARE_BYTES"])
          app_partition_bytes = int(os.environ["APP_PARTITION_BYTES"])
          flash_bytes = int(os.environ["FLASH_BYTES"])
          manifest = {
              "stage": "5/5",
              "status": "factory_image_built_ci_hardware_test_pending",
              "commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "target": {
                  "board": "M5Stack Cardputer ADV",
                  "mcu": "ESP32-S3FN8",
                  "flash_bytes": flash_bytes,
                  "psram": False
              },
              "factory_image": {
                  "filename": "ROZA-Cardputer-ADV-Hawkins-factory.bin",
                  "flash_address": "0x0000",
                  "application_offset": "0x10000"
              },
              "application_partition": {
                  "offset": "0x10000",
                  "bytes": app_partition_bytes,
                  "firmware_bin_bytes": firmware_bytes,
                  "remaining_binary_bytes": app_partition_bytes - firmware_bytes
              },
              "platformio_linked_memory_summary": {
                  "ram": os.environ["RAM_LINE"],
                  "flash": os.environ["FLASH_LINE"],
                  "note": "Static/link-time usage from PlatformIO. Not a measurement of free runtime heap."
              },
              "runtime_heap_measurement": {
                  "available_serial_markers": [
                      "[hawkins-llm] HEAP avant modele",
                      "[hawkins-llm] HEAP apres poids",
                      "[hawkins-llm] HEAP IA prete"
                  ],
                  "measured_on_physical_cardputer": False
              },
              "model": model_manifest
          }
          Path(os.environ["RUNNER_TEMP"], "roza-firmware-package", "BUILD_MANIFEST.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

          cat > "$PACKAGE/INSTALLATION.txt" <<'EOF'
          ROZA / HAWKINS — M5Stack Cardputer ADV (ESP32-S3FN8, 8 MB Flash, sans PSRAM)

          IMAGE COMPLETE RECOMMANDEE
          ROZA-Cardputer-ADV-Hawkins-factory.bin
          Adresse de flash : 0x0000

          APPLICATION SEULE (uniquement si le bootloader et la table ROZA
          correspondants sont deja installes)
          ROZA-Cardputer-ADV-Hawkins-application.bin
          Adresse de flash : 0x10000

          Images separees pour diagnostic :
            bootloader.bin : 0x0000
            partitions.bin : 0x8000
            application : 0x10000

          Le manifeste BUILD_MANIFEST.json indique le commit, la cible, la taille
          de l'image, la capacite de la partition, le resume RAM/Flash PlatformIO
          et la provenance du modele. ELF_SECTIONS.txt detaille les sections liees.
          PLATFORMIO_MEMORY.txt contient le resume de memoire du compilateur.
          MODEL_SHA256SUMS.txt contient les empreintes des poids et du tokenizer.
          SHA256SUMS.txt verifie tous les fichiers de livraison.

          La carte microSD sert au stockage ; copier un BIN sur la SD ne flashe
          pas le microcontroleur. Le flash se fait par USB-C avec un outil ESP32-S3.

          Cette image est compilee pour le Cardputer ADV 8 MB, sans PSRAM.
          La compilation CI ne remplace pas un essai sur la carte reelle.
          Les lignes serie [hawkins-llm] HEAP mesurent le heap interne au demarrage
          et apres chargement des poids/tokenizer.
          EOF

          (cd "$PACKAGE" && sha256sum \
            *.bin BUILD_MANIFEST.json model_manifest.json MODEL_SHA256SUMS.txt \
            PLATFORMIO_MEMORY.txt PLATFORMIO_BUILD_REPORT.txt ELF_SECTIONS.txt INSTALLATION.txt \
            > SHA256SUMS.txt)
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS.txt)
          ls -lh "$PACKAGE"

      - name: Upload flashable firmware package
        uses: actions/upload-artifact@v4
        with:
          name: ROZA-Cardputer-ADV-Hawkins-${{ github.sha }}
          path: ${{ runner.temp }}/roza-firmware-package/
          if-no-files-found: error
          retention-days: 90

      - name: Run native Hawkins tests
        working-directory: firmware
        run: bash tools/hawkinstest/build.sh

      - name: Run native Hawkins AI USB protocol tests
        working-directory: firmware
        run: bash tools/hawkinsaitest/build.sh

      - name: Run native Hawkins LLM engine tests
        working-directory: firmware
        run: bash tools/hawkinsllmtest/build.sh

      - name: Prepare optional simulator-only credentials
        working-directory: firmware
        run: |
          cp src/secrets.h.example src/secrets.h
          sed -i 's/#define N2YO_API_KEY ""/#define N2YO_API_KEY "SIMULATOR"/' src/secrets.h

      - name: Render screens using firmware drawing code
        working-directory: firmware/tools/uisim
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Assemble static web app and firmware download
        working-directory: firmware/tools/uisim
        run: |
          chmod +x web/build-site.sh
          ./web/build-site.sh "$GITHUB_WORKSPACE/site"
          mkdir -p "$GITHUB_WORKSPACE/site/downloads"
          cp "$RUNNER_TEMP/roza-firmware-package/ROZA-Cardputer-ADV-Hawkins-factory.bin" \
            "$GITHUB_WORKSPACE/site/downloads/ROZA-Cardputer-ADV-Hawkins-factory.bin"
          cp "$RUNNER_TEMP/roza-firmware-package/INSTALLATION.txt" \
            "$GITHUB_WORKSPACE/site/downloads/INSTALLATION.txt"
          cp "$RUNNER_TEMP/roza-firmware-package/BUILD_MANIFEST.json" \
            "$GITHUB_WORKSPACE/site/downloads/BUILD_MANIFEST.json"
          cp "$RUNNER_TEMP/roza-firmware-package/SHA256SUMS.txt" \
            "$GITHUB_WORKSPACE/site/downloads/SHA256SUMS.txt"
          cp "$GITHUB_WORKSPACE/docs/HAWKINS_INSTALLATION.md" \
            "$GITHUB_WORKSPACE/site/downloads/HAWKINS_INSTALLATION.md"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish web viewer and firmware
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
